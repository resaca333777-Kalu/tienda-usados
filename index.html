<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Tienda de Usados</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  margin: 0;
  padding: 0;
}
header {
  background: black;
  color: white;
  padding: 40px 20px;
  text-align: center;
}
header h1 {
  margin: 0 0 10px 0;
}
header p {
  margin: 0;
  opacity: 0.8;
}
.productos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 30px;
  padding: 30px 20px;
  max-width: 1200px;
  margin: 0 auto;
}
.producto {
  background: white;
  border-radius: 15px;
  padding: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.galeria-fotos {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-bottom: 15px;
}
.galeria-fotos img:first-child {
  grid-column: span 2;
}
.producto img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 10px;
  margin-bottom: 15px;
  cursor: zoom-in; /* Cambia el cursor para indicar que se puede agrandar */
  transition: transform 0.2s;
}
.producto img:hover {
  transform: scale(1.02);
}
.galeria-fotos img {
  height: 100px;
  margin-bottom: 0;
}
.producto h2 {
  font-size: 1.35rem;
  margin: 10px 0;
}
.producto p {
  font-size: 1.2rem;
  font-weight: bold;
  color: #333;
  margin: 0 0 15px 0;
}
button {
  background: black;
  color: white;
  padding: 12px;
  border: none;
  border-radius: 10px;
  width: 100%;
  cursor: pointer;
  font-weight: bold;
  transition: background 0.3s ease;
}
button:hover {
  background: #333;
}
footer {
  background: black;
  color: white;
  text-align: center;
  padding: 25px;
  margin-top: 40px;
}

/* === ESTILOS PARA AGRANDAR LA FOTO === */
.pantalla-oscura {
  display: none;
  position: fixed;
  z-index: 9999;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
  cursor: zoom-out;
}
.foto-grande {
  max-width: 90%;
  max-height: 85%;
  border-radius: 8px;
  box-shadow: 0 0 20px rgba(255,255,255,0.2);
}
.boton-cerrar {
  position: absolute;
  top: 20px;
  right: 30px;
  color: white;
  font-size: 40px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>
<body>

<header>
  <h1>Retro Tienda</h1>
  <p>Moda circular, calzado urbano y reliquias militares listas para usar.</p>
</header>

<section class="productos">

  <!-- PRODUCTO 1: GABÁN MILITAR -->
  <div class="producto">
    <div class="galeria-fotos">
      <img src="Gaban de abrigo militar mimetizado selva.jpg" alt="Gabán militar" onclick="agrandarFoto(this)">
      <img src="Gaban de abrigo mimetizado selva..jpg" alt="Vista 2" onclick="agrandarFoto(this)">
      <img src="Gabán de abrigo con forro interno.jpg" alt="Vista 3" onclick="agrandarFoto(this)">
      <img src="Gabán de abrigo parte trasera.jpg" alt="Vista trasera" onclick="agrandarFoto(this)">
      <img src="talla gaban de abrigo.jpg" alt="Talla" onclick="agrandarFoto(this)">
    </div>
    <h2>Gabán militar mimetizado selva</h2>
    <p>$55.000</p>
    <a href="https://wa.me" target="_blank">
      <button>Consultar por WhatsApp</button>
    </a>
  </div>

  <!-- PRODUCTO 2: ZAPATILLAS -->
  <div class="producto">
    <img src="https://unsplash.com" alt="Zapatillas" onclick="agrandarFoto(this)">
    <h2>Zapatillas</h2>
    <p>$30.000</p>
    <a href="https://wa.me" target="_blank">
      <button>Consultar por WhatsApp</button>
    </a>
  </div>

  <!-- PRODUCTO 3: COCINA -->
  <div class="producto">
    <img src="https://unsplash.com" alt="Artículos de cocina" onclick="agrandarFoto(this)">
    <h2>Artículos de cocina</h2>
    <p>$18.000</p>
    <a href="https://wa.me" target="_blank">
      <button>Consultar por WhatsApp</button>
    </a>
  </div>

</section>

<!-- PANTALLA OCURSA PARA VER LA FOTO AGRANDADA -->
<div id="miModal" class="pantalla-oscura" onclick="cerrarFoto()">
  <span class="boton-cerrar">&times;</span>
  <img class="foto-grande" id="fotoAmpliada">
</div>

<footer>
  <p>© 2026 Retro Tienda</p>
</footer>

<!-- PROGRAMACIÓN PARA EL EFECTO CLICK -->
<script>
function agrandarFoto(elemento) {
  var modal = document.getElementById("miModal");
  var imagenGrande = document.getElementById("fotoAmpliada");
  modal.style.display = "flex";
  imagenGrande.src = elemento.src;
}

function cerrarFoto() {
  var modal = document.getElementById("miModal");
  modal.style.display = "none";
}
</script>

</body>
</html>
.
