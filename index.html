<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Tienda de Usados</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  margin: 0;
  padding: 0;
}
header {
  background: black;
  color: white;
  padding: 40px 20px;
  text-align: center;
}
header h1 {
  margin: 0 0 10px 0;
}
header p {
  margin: 0;
  opacity: 0.8;
}
.productos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 30px;
  padding: 30px 20px;
  max-width: 1200px;
  margin: 0 auto;
}
.producto {
  background: white;
  border-radius: 15px;
  padding: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
/* Contenedor para cuando un producto tiene muchas fotos */
.galeria-fotos {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-bottom: 15px;
}
/* La primera foto de la galería se ve más grande */
.galeria-fotos img:first-child {
  grid-column: span 2;
}
.producto img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 10px;
  margin-bottom: 15px;
}
/* Ajuste de tamaño para las fotos secundarias de la galería */
.galeria-fotos img {
  height: 100px;
  margin-bottom: 0;
}
.producto h2 {
  font-size: 1.35rem;
  margin: 10px 0;
}
.producto p {
  font-size: 1.2rem;
  font-weight: bold;
  color: #333;
  margin: 0 0 15px 0;
}
button {
  background: black;
  color: white;
  padding: 12px;
  border: none;
  border-radius: 10px;
  width: 100%;
  cursor: pointer;
  font-weight: bold;
  transition: background 0.3s ease;
}
button:hover {
  background: #333;
}
footer {
  background: black;
  color: white;
  text-align: center;
  padding: 25px;
  margin-top: 40px;
}
</style>
</head>
<body>

<header>
  <h1>El Garaje Vintage</h1>
  <p>Dale una segunda oportunidad al estilo. Ropa, calzado y tesoros únicos con historia.</p>
</header>

<section class="productos">

  <!-- PRODUCTO 1: GABÁN MILITAR CON GALERÍA -->
  <div class="producto">
    <div class="galeria-fotos">
      <img src="Gaban de abrigo militar mimetizado selva.jpg" alt="Gabán militar">
      <img src="Gaban de abrigo mimetizado selva..jpg" alt="Vista 2">
      <img src="Gabán de abrigo con forro interno.jpg" alt="Vista 3">
      <img src="Gabán de abrigo parte trasera.jpg" alt="Vista trasera">
      <img src="talla gaban de abrigo.jpg" alt="Talla">
    </div>
    <h2>Gabán militar mimetizado selva</h2>
    <p>$55.000</p>
    <a href="https://wa.me/5492945690253?text=Hola,%20me%20interesa%20el%20Gabán%20militar%20mimetizado%20selva" target="_blank">
      <button>Consultar por WhatsApp</button>
    </a>
  </div>

  <!-- PRODUCTO 2: ZAPATILLAS -->
  <div class="producto">
    <img src="https://unsplash.com" alt="Zapatillas">
    <h2>Zapatillas</h2>
    <p>$30.000</p>
    <a href="https://wa.me/5492945690253?text=Hola,%20me%20interesan%20las%20Zapatillas%20de%20$30.000" target="_blank">
      <button>Consultar por WhatsApp</button>
    </a>
  </div>

  <!-- PRODUCTO 3: COCINA -->
  <div class="producto">
    <img src="https://unsplash.com" alt="Artículos de cocina">
    <h2>Artículos de cocina</h2>
    <p>$18.000</p>
    <a href="https://wa.me/5492945690253?text=Hola,%20me%20interesan%20los%20Artículos%20de%20cocina%20de%20$18.000" target="_blank">
      <button>Consultar por WhatsApp</button>
    </a>
  </div>

</section>

<footer>
  <p>© 2026 Mi Tienda de Usados</p>
</footer>

</body>
</html>
